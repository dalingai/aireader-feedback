name: Bug report
description: Something in the app doesn't work, crashes or behaves strangely.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the problem is how a particular paper looks, use **Paper displays wrong** instead.
        **This is public:** please don't post personal information.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Discover
        2. Tap …
        3. …
  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Happened once
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Paste or drag them in.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About → Version.
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: "iPad Air (M2), iPadOS 26.1"
    validations:
      required: true
